name: Bug report
description: Reportar defeito na plataforma base.
title: "[bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Resumo
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto
      description: Liste os ambientes e capacidades afetadas.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir
    validations:
      required: true

