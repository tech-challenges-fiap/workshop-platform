name: Feature request
description: Request a platform capability enhancement.
title: "[feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What need should the platform address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
