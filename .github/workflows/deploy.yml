name: Deploy

on:
  push:
    branches:
      - stag
      - prod
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate-ref:
    name: validate ref
    runs-on: ubuntu-latest
    outputs:
      github_environment: ${{ steps.ref.outputs.github_environment }}
    steps:
      - name: Validate deploy branch
        id: ref
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            stag)
              echo "github_environment=staging" >> "${GITHUB_OUTPUT}"
              ;;
            prod)
              echo "github_environment=production" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Deploy is only allowed from stag or prod branches." >&2
              exit 1
              ;;
          esac

  deploy:
    name: deploy
    needs: validate-ref
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.validate-ref.outputs.github_environment }}
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
      DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
      ENABLE_DATADOG: ${{ vars.ENABLE_DATADOG }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Prepare backend config
        run: |
          set -euo pipefail

          cat <<EOF > backend.hcl
          bucket       = "${TF_STATE_BUCKET}"
          key          = "${TF_STATE_KEY:-terraform.tfstate}"
          region       = "${AWS_REGION}"
          use_lockfile = true
          EOF

      - name: Prepare Terraform variables
        run: |
          set -euo pipefail

          enable_datadog="${ENABLE_DATADOG:-false}"
          datadog_api_key="${DATADOG_API_KEY:-}"
          datadog_app_key="${DATADOG_APP_KEY:-}"

          if [ "${enable_datadog}" = "true" ] && [ -z "${datadog_api_key}" ]; then
            echo "DATADOG_API_KEY secret is required when ENABLE_DATADOG is true." >&2
            exit 1
          fi

          if [ "${enable_datadog}" = "true" ] && [ -z "${datadog_app_key}" ]; then
            echo "DATADOG_APP_KEY secret is required when ENABLE_DATADOG is true." >&2
            exit 1
          fi

          jq -n \
            --arg aws_region "${AWS_REGION}" \
            --arg datadog_api_key "${datadog_api_key}" \
            --arg datadog_app_key "${datadog_app_key}" \
            --argjson enable_datadog "${enable_datadog}" \
            '{
              aws_region: $aws_region,
              datadog_api_key: (if $datadog_api_key == "" then null else $datadog_api_key end),
              datadog_app_key: (if $datadog_app_key == "" then null else $datadog_app_key end),
              enable_datadog: $enable_datadog,
              environment: "shared",
              repo: "platform"
            }' > ci.auto.tfvars.json

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Restore missing EKS cluster
        run: |
          set -euo pipefail

          cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
          if [ -z "${cluster_name}" ]; then
            cluster_name="workshop-platform-shared-cluster"
          fi

          describe_error="$(mktemp)"
          if aws eks describe-cluster --region "${AWS_REGION}" --name "${cluster_name}" >/dev/null 2>"${describe_error}"; then
            echo "EKS cluster ${cluster_name} exists."
            rm -f "${describe_error}"
            exit 0
          fi

          if ! grep -q "ResourceNotFoundException" "${describe_error}"; then
            cat "${describe_error}" >&2
            rm -f "${describe_error}"
            exit 1
          fi

          rm -f "${describe_error}"
          echo "EKS cluster ${cluster_name} is missing; restoring AWS/EKS resources before Kubernetes resources."
          terraform apply -auto-approve -target=module.network -target=module.eks

      - name: Break stale state lock
        run: |
          set -euo pipefail
          lock_file="s3://${TF_STATE_BUCKET}/${TF_STATE_KEY:-terraform.tfstate}.tflock"
          if aws s3 ls "${lock_file}" >/dev/null 2>&1; then
            echo "⚠️ Stale lock detected at ${lock_file}, removing..."
            aws s3 rm "${lock_file}"
          else
            echo "No stale lock found."
          fi

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Smoke check platform
        run: |
          set -euo pipefail

          cluster_name="$(terraform output -raw cluster_name)"
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${cluster_name}"

          kubectl cluster-info
          kubectl get namespace stag
          kubectl get namespace prod
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=180s
          kubectl -n ingress-nginx get service ingress-nginx-controller

          if [ "${ENABLE_DATADOG:-false}" = "true" ]; then
            kubectl get namespace datadog
            kubectl -n datadog rollout status daemonset/datadog --timeout=300s || echo "⚠️ Datadog DaemonSet not fully ready yet (non-blocking)"
          else
            echo "Datadog smoke check skipped because ENABLE_DATADOG is not true."
          fi
