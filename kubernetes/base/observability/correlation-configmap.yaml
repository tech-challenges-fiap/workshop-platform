apiVersion: v1
kind: ConfigMap
metadata:
  name: correlation-observability-config
  namespace: stag
  labels:
    app.kubernetes.io/name: correlation-observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: workshop-phase-4
    app.kubernetes.io/managed-by: workshop-platform
data:
  CORRELATION_ID_HTTP_HEADER: X-Correlation-Id
  CORRELATION_ID_MESSAGE_HEADER: correlationId
  CORRELATION_ID_LOG_FIELD: correlationId
  CORRELATION_ID_METRICS_LABEL: correlation_id
  CORRELATION_ID_PROPAGATION_TARGETS: http,rabbitmq,logs,metrics
  CORRELATION_ID_GENERATION_POLICY: application-runtime
  OBSERVABILITY_STACK_STATUS: convention-only
